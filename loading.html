<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EEF2FF">
  <meta name="robots" content="noindex, nofollow">
  <script id="loading-screen-session-guard">
    try {
      if (window.sessionStorage.getItem("arisuFixHomepageLoadingShown") === "1") window.location.replace("/home");
    } catch (error) { window.location.replace("/home"); }
  </script>
  <title>Arisu Fix | Starting Up</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/loading-screen.css?v=AFV489">
  <script src="/loading-screen.js?v=AFV488" defer></script>
</head>
<body>
<div id="arisu-loading-screen" class="is-visible" role="status" aria-label="Loading Arisu Fix homepage">
  <section class="boot-window" aria-labelledby="arisuBootTitle">
    <div class="boot-titlebar" aria-hidden="true"><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-dot"></span><span class="boot-label">ARISU FIX / SYSTEM STARTUP</span></div>
    <div class="boot-content">
      <div class="boot-brand-row">
        <img class="boot-logo" src="/assets/images/arisu-fix-alice-borderland-logo-transparent.png?v=AFV460" alt="Official Arisu Fix loading-screen logo" width="150" height="150">
        <div class="boot-brand-copy"><h1 class="boot-brand" id="arisuBootTitle">Arisu <span>Fix</span></h1>
        <p class="boot-subtitle">RECOVERY CONTACT &amp; ASSISTANCE</p></div>
      </div>
      <div class="boot-brand-divider" aria-hidden="true"></div>
      <p class="boot-section">INITIALIZATION SEQUENCE</p>
      <ul class="boot-log" aria-live="polite">
        <li data-check="dom"><span class="boot-mark">○</span><span class="boot-message">Preparing homepage document</span><span class="boot-status">WAIT</span></li>
        <li data-check="styles"><span class="boot-mark">○</span><span class="boot-message">Checking page stylesheets</span><span class="boot-status">WAIT</span></li>

        <li data-check="final"><span class="boot-mark">○</span><span class="boot-message">Finalizing interface...</span><span class="boot-status">WAIT</span></li>
      </ul>
      <div class="boot-progress-row"><span>STARTUP PROGRESS</span><span class="boot-progress-value">0%</span></div>
      <div class="boot-progress-track" role="progressbar" aria-label="Homepage initialization progress" aria-valuemin="0" aria-valuemax="100"><div class="boot-progress-fill"></div></div>
      <p class="boot-footnote">Waiting for actual page readiness…</p>
    </div>
  </section>
</div>
<noscript><p><a href="/index.html">Continue to Arisu Fix</a></p></noscript>
</body>
</html>
