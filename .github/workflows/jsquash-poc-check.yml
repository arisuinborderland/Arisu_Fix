name: jSquash Cloudflare POC

on:
  push:
    branches:
      - migration/cloudflare-jSquash-poc
  pull_request:
    branches:
      - migration/cloudflare-stories
      - main

jobs:
  package-and-wasm-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated POC branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install existing locked project dependencies
        run: npm ci

      - name: Install pinned jSquash codecs and Wrangler in temporary workspace
        run: |
          mkdir -p /tmp/jsquash-poc
          cd /tmp/jsquash-poc
          npm init -y
          npm install --save-exact @jsquash/jpeg@1.6.0 @jsquash/png@3.1.1 @jsquash/webp@1.5.0 wrangler

      - name: Verify pinned package versions and discover decoder assets
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const expected = {
            "@jsquash/jpeg": "1.6.0",
            "@jsquash/png": "3.1.1",
            "@jsquash/webp": "1.5.0"
          };

          for (const [name, version] of Object.entries(expected)) {
            const root = path.join(process.cwd(), "node_modules", ...name.split("/"));
            const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
            if (pkg.version !== version) {
              throw new Error(`${name}: expected ${version}, found ${pkg.version}`);
            }

            const wasmFiles = [];
            const jsFiles = [];
            const visit = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) visit(full);
                else {
                  const relative = path.relative(root, full);
                  if (entry.name.endsWith(".wasm")) wasmFiles.push(relative);
                  if (entry.name.endsWith(".js")) jsFiles.push(relative);
                }
              }
            };
            visit(root);

            if (wasmFiles.length === 0) throw new Error(`${name}: no WASM assets found`);
            console.log(`${name}@${version}; package exports:`, JSON.stringify(pkg.exports ?? null));
            console.log("  JS entries:", jsFiles.filter((file) => /decode|index|init/i.test(file)).join(", "));
            console.log("  WASM assets:", wasmFiles.join(", "));
          }
          EOF

      - name: Inspect real ESM decoder exports
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          for (const name of ["@jsquash/jpeg", "@jsquash/png", "@jsquash/webp"]) {
            const mod = await import(name);
            const exports = Object.keys(mod).sort();
            if (!exports.includes("default") && !exports.includes("decode")) {
              throw new Error(`${name}: no recognizable decoder export. Exports: ${exports.join(", ")}`);
            }
            console.log(name, "exports:", exports.join(", "));
          }
          EOF

      - name: Runtime smoke test for JPEG, PNG, WebP and invalid input
        run: |
          cd /tmp/jsquash-poc
          fixture_ref="da47a2be3b302beb5a5ae164a2ab7aa21a041d90"
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/jamsinclair/jSquash/$fixture_ref/test/fixtures/test.jpeg" -o fixture.jpeg
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/jamsinclair/jSquash/$fixture_ref/test/fixtures/test.png" -o fixture.png
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/jamsinclair/jSquash/$fixture_ref/test/fixtures/test.webp" -o fixture.webp
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import decodeJpeg, { init as initJpeg } from "@jsquash/jpeg/decode.js";
          import decodePng, { init as initPng } from "@jsquash/png/decode.js";
          import decodeWebp, { init as initWebp } from "@jsquash/webp/decode.js";

          const root = path.join(process.cwd(), "node_modules", "@jsquash");
          await initJpeg({ wasmBinary: fs.readFileSync(path.join(root, "jpeg/codec/dec/mozjpeg_dec.wasm")) });
          await initPng(fs.readFileSync(path.join(root, "png/codec/pkg/squoosh_png_bg.wasm")));
          await initWebp({ wasmBinary: fs.readFileSync(path.join(root, "webp/codec/dec/webp_dec.wasm")) });

          const fixtures = [
            ["JPEG", decodeJpeg, "fixture.jpeg"],
            ["PNG", decodePng, "fixture.png"],
            ["WebP", decodeWebp, "fixture.webp"]
          ];
          const toArrayBuffer = (bytes) => bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);

          for (const [name, decode, file] of fixtures) {
            const decoded = await decode(toArrayBuffer(fs.readFileSync(file)));
            assert.ok(decoded.width > 0 && decoded.height > 0, name + " dimensions should be positive");
            assert.equal(decoded.data.length, decoded.width * decoded.height * 4, name + " should decode to RGBA data");
            console.log(name + " decode smoke test passed", decoded.width + "x" + decoded.height);
          }
          for (const [name, decode] of [["JPEG", decodeJpeg], ["PNG", decodePng], ["WebP", decodeWebp]]) {
            await assert.rejects(() => decode(toArrayBuffer(Buffer.from([1, 2, 3, 4]))), undefined,
              name + " decoder should reject invalid bytes");
            console.log(name + " invalid-input rejection passed");
          }
          EOF

      - name: Record Wrangler version
        run: /tmp/jsquash-poc/node_modules/.bin/wrangler --version
