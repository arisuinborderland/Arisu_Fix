name: jSquash Cloudflare POC

on:
  push:
    branches:
      - migration/cloudflare-jSquash-poc
  pull_request:
    branches:
      - migration/cloudflare-stories
      - main

jobs:
  package-and-wasm-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated POC branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install existing locked project dependencies
        run: npm ci

      - name: Install pinned jSquash codecs and Wrangler in temporary workspace
        run: |
          mkdir -p /tmp/jsquash-poc
          cd /tmp/jsquash-poc
          npm init -y
          npm install --save-exact @jsquash/jpeg@1.6.0 @jsquash/png@3.1.1 @jsquash/webp@1.5.0 wrangler

      - name: Verify pinned package versions and discover decoder assets
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const expected = {
            "@jsquash/jpeg": "1.6.0",
            "@jsquash/png": "3.1.1",
            "@jsquash/webp": "1.5.0"
          };

          for (const [name, version] of Object.entries(expected)) {
            const root = path.join(process.cwd(), "node_modules", ...name.split("/"));
            const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
            if (pkg.version !== version) {
              throw new Error(`${name}: expected ${version}, found ${pkg.version}`);
            }

            const wasmFiles = [];
            const jsFiles = [];
            const visit = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) visit(full);
                else {
                  const relative = path.relative(root, full);
                  if (entry.name.endsWith(".wasm")) wasmFiles.push(relative);
                  if (entry.name.endsWith(".js")) jsFiles.push(relative);
                }
              }
            };
            visit(root);

            if (wasmFiles.length === 0) throw new Error(`${name}: no WASM assets found`);
            console.log(`${name}@${version}; package exports:`, JSON.stringify(pkg.exports ?? null));
            console.log("  JS entries:", jsFiles.filter((file) => /decode|index|init/i.test(file)).join(", "));
            console.log("  WASM assets:", wasmFiles.join(", "));
          }
          EOF

      - name: Inspect real ESM decoder exports
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          for (const name of ["@jsquash/jpeg", "@jsquash/png", "@jsquash/webp"]) {
            const mod = await import(name);
            const exports = Object.keys(mod).sort();
            if (!exports.includes("default") && !exports.includes("decode")) {
              throw new Error(`${name}: no recognizable decoder export. Exports: ${exports.join(", ")}`);
            }
            console.log(name, "exports:", exports.join(", "));
          }
          EOF

      - name: Runtime smoke test for JPEG, PNG, WebP and invalid input
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import { encode as encodeJpeg, decode as decodeJpeg } from "@jsquash/jpeg";
          import { encode as encodePng, decode as decodePng } from "@jsquash/png";
          import { encode as encodeWebp, decode as decodeWebp } from "@jsquash/webp";

          // Tiny synthetic RGBA fixture: opaque red pixel plus transparent green pixel.
          const width = 2;
          const height = 1;
          const pixels = new Uint8ClampedArray([
            255, 0, 0, 255,
            0, 255, 0, 0
          ]);
          const input = { data: pixels, width, height };
          const toArrayBuffer = (bytes) => bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);

          for (const [name, encode, decode] of [
            ["JPEG", encodeJpeg, decodeJpeg],
            ["PNG", encodePng, decodePng],
            ["WebP", encodeWebp, decodeWebp]
          ]) {
            const encoded = await encode(input);
            const bytes = encoded instanceof ArrayBuffer
              ? encoded
              : toArrayBuffer(encoded);
            assert.ok(bytes.byteLength > 0, name + " encoder returned empty bytes");
            const decoded = await decode(bytes);
            assert.equal(decoded.width, width, name + " decoded width mismatch");
            assert.equal(decoded.height, height, name + " decoded height mismatch");
            assert.equal(decoded.data.length, width * height * 4, name + " RGBA length mismatch");
            console.log(name + " encode/decode smoke test passed", bytes.byteLength + " bytes");
            if (name === "PNG") assert.equal(decoded.data[7], 0, "PNG transparency was not preserved");
          }

          for (const [name, decode] of [
            ["JPEG", decodeJpeg], ["PNG", decodePng], ["WebP", decodeWebp]
          ]) {
            await assert.rejects(() => decode(new Uint8Array([1, 2, 3, 4]).buffer), undefined,
              name + " decoder should reject invalid bytes");
            console.log(name + " invalid-input rejection passed");
          }
          EOF

      - name: Record Wrangler version
        run: /tmp/jsquash-poc/node_modules/.bin/wrangler --version
