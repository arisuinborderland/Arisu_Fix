name: jSquash Cloudflare POC

on:
  push:
    branches:
      - migration/cloudflare-jSquash-poc
  pull_request:
    branches:
      - migration/cloudflare-stories
      - main

jobs:
  package-and-wasm-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated POC branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install existing locked project dependencies
        run: npm ci

      - name: Install pinned jSquash codecs and Wrangler in temporary workspace
        run: |
          mkdir -p /tmp/jsquash-poc
          cd /tmp/jsquash-poc
          npm init -y
          npm install --save-exact @jsquash/jpeg@1.6.0 @jsquash/png@3.1.1 @jsquash/webp@1.5.0 pngjs@7.0.0 wrangler@4.152.0

      - name: Verify pinned package versions and discover decoder assets
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const expected = {
            "@jsquash/jpeg": "1.6.0",
            "@jsquash/png": "3.1.1",
            "@jsquash/webp": "1.5.0"
          };

          for (const [name, version] of Object.entries(expected)) {
            const root = path.join(process.cwd(), "node_modules", ...name.split("/"));
            const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
            if (pkg.version !== version) {
              throw new Error(`${name}: expected ${version}, found ${pkg.version}`);
            }

            const wasmFiles = [];
            const jsFiles = [];
            const visit = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) visit(full);
                else {
                  const relative = path.relative(root, full);
                  if (entry.name.endsWith(".wasm")) wasmFiles.push(relative);
                  if (entry.name.endsWith(".js")) jsFiles.push(relative);
                }
              }
            };
            visit(root);

            if (wasmFiles.length === 0) throw new Error(`${name}: no WASM assets found`);
            console.log(`${name}@${version}; package exports:`, JSON.stringify(pkg.exports ?? null));
            console.log("  JS entries:", jsFiles.filter((file) => /decode|index|init/i.test(file)).join(", "));
            console.log("  WASM assets:", wasmFiles.join(", "));
          }
          EOF

      - name: Inspect real ESM decoder exports
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          for (const name of ["@jsquash/jpeg", "@jsquash/png", "@jsquash/webp"]) {
            const mod = await import(name);
            const exports = Object.keys(mod).sort();
            if (!exports.includes("default") && !exports.includes("decode")) {
              throw new Error(`${name}: no recognizable decoder export. Exports: ${exports.join(", ")}`);
            }
            console.log(name, "exports:", exports.join(", "));
          }
          EOF

      - name: Runtime smoke test for JPEG, PNG, WebP and invalid input
        run: |
          cd /tmp/jsquash-poc
          fixture_ref="da47a2be3b302beb5a5ae164a2ab7aa21a041d90"
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/jamsinclair/jSquash/$fixture_ref/test/fixtures/test.jpeg" -o fixture.jpeg
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/jamsinclair/jSquash/$fixture_ref/test/fixtures/test.png" -o fixture.png
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/jamsinclair/jSquash/$fixture_ref/test/fixtures/test.webp" -o fixture.webp
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import decodeJpeg, { init as initJpeg } from "@jsquash/jpeg/decode.js";
          import decodePng, { init as initPng } from "@jsquash/png/decode.js";
          import decodeWebp, { init as initWebp } from "@jsquash/webp/decode.js";

          const root = path.join(process.cwd(), "node_modules", "@jsquash");
          await initJpeg({ wasmBinary: fs.readFileSync(path.join(root, "jpeg/codec/dec/mozjpeg_dec.wasm")) });
          await initPng(fs.readFileSync(path.join(root, "png/codec/pkg/squoosh_png_bg.wasm")));
          await initWebp({ wasmBinary: fs.readFileSync(path.join(root, "webp/codec/dec/webp_dec.wasm")) });

          const fixtures = [
            ["JPEG", decodeJpeg, "fixture.jpeg"],
            ["PNG", decodePng, "fixture.png"],
            ["WebP", decodeWebp, "fixture.webp"]
          ];
          const toArrayBuffer = (bytes) => bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);

          for (const [name, decode, file] of fixtures) {
            const decoded = await decode(toArrayBuffer(fs.readFileSync(file)));
            assert.ok(decoded.width > 0 && decoded.height > 0, name + " dimensions should be positive");
            assert.equal(decoded.data.length, decoded.width * decoded.height * 4, name + " should decode to RGBA data");
            console.log(name + " decode smoke test passed", decoded.width + "x" + decoded.height);
          }
          for (const [name, decode] of [["JPEG", decodeJpeg], ["PNG", decodePng], ["WebP", decodeWebp]]) {
            await assert.rejects(() => decode(toArrayBuffer(Buffer.from([1, 2, 3, 4]))), undefined,
              name + " decoder should reject invalid bytes");
            console.log(name + " invalid-input rejection passed");
          }
          EOF

      - name: Verify Cloudflare Worker bundling and local runtime
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import { PNG } from "pngjs";

          const transparent = new PNG({ width: 1, height: 1 });
          transparent.data[0] = 255;
          transparent.data[1] = 0;
          transparent.data[2] = 0;
          transparent.data[3] = 0;
          fs.writeFileSync("transparent.png", PNG.sync.write(transparent));

          const widePng = new PNG({ width: 4097, height: 1 });
          const fixtures = {
            jpeg: fs.readFileSync("fixture.jpeg").toString("base64"),
            png: fs.readFileSync("fixture.png").toString("base64"),
            webp: fs.readFileSync("fixture.webp").toString("base64"),
            transparentPng: fs.readFileSync("transparent.png").toString("base64"),
            widePng: PNG.sync.write(widePng).toString("base64"),
            oversized: Buffer.alloc(3 * 1024 * 1024 + 1).toString("base64")
          };
          const source = `
          import decodeJpeg, { init as initJpeg } from "@jsquash/jpeg/decode.js";
          import decodePng, { init as initPng } from "@jsquash/png/decode.js";
          import decodeWebp, { init as initWebp } from "@jsquash/webp/decode.js";
          import JPEG_DEC_WASM from "./node_modules/@jsquash/jpeg/codec/dec/mozjpeg_dec.wasm";
          import PNG_DEC_WASM from "./node_modules/@jsquash/png/codec/pkg/squoosh_png_bg.wasm";
          import WEBP_DEC_WASM from "./node_modules/@jsquash/webp/codec/dec/webp_dec.wasm";

          const fixtures = ${JSON.stringify(fixtures)};
          const decoders = { jpeg: decodeJpeg, png: decodePng, webp: decodeWebp };
          let initialization;
          function initialize() {
            if (!initialization) {
              initialization = Promise.all([
                initJpeg(JPEG_DEC_WASM),
                initPng(PNG_DEC_WASM),
                initWebp(WEBP_DEC_WASM)
              ]).catch((error) => {
                initialization = undefined;
                throw error;
              });
            }
            return initialization;
          }
          function fromBase64(value) {
            const binary = atob(value);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
          }

          export default {
            async fetch(request) {
              const parts = new URL(request.url).pathname.split("/").filter(Boolean);
              if (parts[0] === "health") return new Response("ok");
              if (parts[0] === "validate") {
                const mime = parts[1];
                const fixture = parts[2];
                const expected = { "image/jpeg": "jpeg", "image/png": "png", "image/webp": "webp" }[mime];
                if (!expected) return Response.json({ error: "unsupported mime" }, { status: 415 });
                const encoded = fixtures[fixture];
                if (!encoded) return Response.json({ error: "unknown fixture" }, { status: 404 });
                const raw = fromBase64(encoded);
                if (raw.byteLength > 3 * 1024 * 1024) return Response.json({ error: "file-too-large" }, { status: 413 });
                if (fixture === "oversized") return Response.json({ error: "file-too-large" }, { status: 413 });
                if (fixture === "widePng" && expected !== "png") return Response.json({ error: "mime-mismatch" }, { status: 415 });
                try {
                  await initialize();
                  const actualCodec = fixture === "widePng" ? "png" : fixture === "transparentPng" ? "png" : fixture;
                  if (actualCodec !== expected) return Response.json({ error: "mime-mismatch" }, { status: 415 });
                  const image = await decoders[expected](raw);
                  if (image.width > 4096 || image.height > 4096 || image.width * image.height > 16000000) {
                    return Response.json({ error: "dimensions-too-large" }, { status: 413 });
                  }
                  return Response.json({ ok: true, width: image.width, height: image.height });
                } catch (error) {
                  return Response.json({ error: "decode-failed" }, { status: 400 });
                }
              }
              const invalid = parts[0] === "invalid";
              const mismatch = parts[0] === "mismatch";
              const transparentPng = parts[0] === "transparent-png";
              const codec = invalid || mismatch ? parts[1] : transparentPng ? "png" : parts[0];
              const decode = decoders[codec];
              if (!decode) return Response.json({ error: "unknown codec" }, { status: 404 });
              try {
                await initialize();
                const bytes = invalid
                  ? new Uint8Array([1, 2, 3, 4]).buffer
                  : mismatch
                    ? fromBase64(fixtures.png)
                    : transparentPng
                      ? fromBase64(fixtures.transparentPng)
                      : fromBase64(fixtures[codec]);
                const image = await decode(bytes);
                if (invalid || mismatch) {
                  return Response.json({ error: "invalid or mismatched input unexpectedly decoded" }, { status: 500 });
                }
                const alpha = transparentPng ? image.data[3] : undefined;
                return Response.json({ codec, width: image.width, height: image.height, rgbaBytes: image.data.length, alpha });
              } catch (error) {
                return Response.json({ error: String(error?.message || error) }, { status: invalid || mismatch ? 400 : 500 });
              }
            }
          };
          `;
          fs.writeFileSync("worker.mjs", source);
          fs.writeFileSync("wrangler.jsonc", JSON.stringify({
            name: "jsquash-cloudflare-poc",
            main: "worker.mjs",
            compatibility_date: "2026-10-25"
          }, null, 2));
          EOF

          ./node_modules/.bin/wrangler deploy --dry-run --outdir=./cloudflare-bundle

          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8797 > ./wrangler-dev.log 2>&1 &
          wrangler_pid=$!
          trap 'kill "$wrangler_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8797/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat ./wrangler-dev.log
            echo "Wrangler local runtime failed to start"
            exit 1
          fi

          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          for (const codec of ["jpeg", "png", "webp"]) {
            const response = await fetch("http://127.0.0.1:8797/" + codec);
            const result = await response.json();
            assert.equal(response.status, 200, codec + " Cloudflare runtime decode failed: " + JSON.stringify(result));
            assert.ok(result.width > 0 && result.height > 0, codec + " dimensions invalid");
            assert.equal(result.rgbaBytes, result.width * result.height * 4, codec + " RGBA size invalid");
            console.log("Cloudflare-compatible " + codec + " decode passed", result.width + "x" + result.height);
          }
          for (const codec of ["jpeg", "png", "webp"]) {
            const response = await fetch("http://127.0.0.1:8797/invalid/" + codec);
            assert.equal(response.status, 400, codec + " Cloudflare runtime should reject invalid data");
            console.log("Cloudflare-compatible " + codec + " invalid input rejection passed");
          }
          for (const [mime, fixture, expectedStatus, expectedError] of [
            ["image/png", "widePng", 413, "dimensions-too-large"],
            ["image/jpeg", "widePng", 415, "mime-mismatch"],
            ["image/png", "oversized", 413, "file-too-large"],
            ["image/gif", "png", 415, "unsupported mime"]
          ]) {
            const response = await fetch("http://127.0.0.1:8797/validate/" + encodeURIComponent(mime) + "/" + fixture);
            const result = await response.json();
            assert.equal(response.status, expectedStatus, "validation status mismatch: " + mime + "/" + fixture);
            assert.equal(result.error, expectedError);
            console.log("End-to-end validation rejection passed", mime + "/" + fixture);
          }
          const validResponse = await fetch("http://127.0.0.1:8797/validate/image/png/png");
          assert.equal(validResponse.status, 200, "valid PNG should pass validation");
          console.log("End-to-end validation accepts valid PNG");
          const transparentResponse = await fetch("http://127.0.0.1:8797/transparent-png");
          const transparentResult = await transparentResponse.json();
          assert.equal(transparentResponse.status, 200, "transparent PNG should decode");
          assert.equal(transparentResult.alpha, 0, "fully transparent PNG alpha should be preserved");
          console.log("Cloudflare-compatible PNG transparency preservation passed");
          const mismatchResponse = await fetch("http://127.0.0.1:8797/mismatch/jpeg");
          assert.equal(mismatchResponse.status, 400, "JPEG decoder should reject PNG bytes as a MIME/format mismatch");
          console.log("Cloudflare-compatible MIME/format mismatch rejection passed");
          EOF

      - name: Verify image-validation policy boundaries
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";

          const MAX_IMAGE_BYTES = 3 * 1024 * 1024;
          const MAX_DIMENSION = 4096;
          const MAX_PIXELS = 16_000_000;
          const FORMATS = Object.freeze({ "image/jpeg": "jpeg", "image/png": "png", "image/webp": "webp" });

          function validatePolicy({ mime, actualFormat, byteLength, width, height, decoded = true }) {
            const expected = FORMATS[mime];
            if (!expected) return { ok: false, reason: "mime-unsupported" };
            if (byteLength < 1) return { ok: false, reason: "empty" };
            if (byteLength > MAX_IMAGE_BYTES) return { ok: false, reason: "file-too-large" };
            if (expected !== actualFormat) return { ok: false, reason: "mime-mismatch" };
            if (!decoded) return { ok: false, reason: "decode-failed" };
            if (!Number.isInteger(width) || !Number.isInteger(height) || width < 1 || height < 1 ||
                width > MAX_DIMENSION || height > MAX_DIMENSION || width * height > MAX_PIXELS) {
              return { ok: false, reason: "dimensions-too-large" };
            }
            return { ok: true };
          }

          const valid = { mime: "image/png", actualFormat: "png", byteLength: 1024, width: 100, height: 100 };
          assert.deepEqual(validatePolicy(valid), { ok: true }, "normal image should pass");
          assert.equal(validatePolicy({ ...valid, byteLength: MAX_IMAGE_BYTES }).ok, true, "exactly 3 MB should pass");
          assert.equal(validatePolicy({ ...valid, byteLength: MAX_IMAGE_BYTES + 1 }).reason, "file-too-large");
          assert.equal(validatePolicy({ ...valid, mime: "image/jpeg" }).reason, "mime-mismatch");
          assert.equal(validatePolicy({ ...valid, mime: "image/gif" }).reason, "mime-unsupported");
          assert.equal(validatePolicy({ ...valid, decoded: false }).reason, "decode-failed");
          assert.equal(validatePolicy({ ...valid, width: MAX_DIMENSION, height: 1 }).ok, true, "dimension boundary should pass");
          assert.equal(validatePolicy({ ...valid, width: MAX_DIMENSION + 1, height: 1 }).reason, "dimensions-too-large");
          assert.equal(validatePolicy({ ...valid, width: 4001, height: 4000 }).reason, "dimensions-too-large");
          assert.equal(validatePolicy({ ...valid, width: 4096, height: 3907 }).reason, "dimensions-too-large");
          console.log("Image-validation policy boundary tests passed");
          EOF

      - name: Verify actual decoded dimensions and byte limits
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { PNG } from "pngjs";

          const png = new PNG({ width: 4097, height: 1 });
          for (let x = 0; x < png.width; x++) {
            const offset = x * 4;
            png.data[offset] = 0;
            png.data[offset + 1] = 0;
            png.data[offset + 2] = 0;
            png.data[offset + 3] = 0;
          }
          fs.writeFileSync("too-wide.png", PNG.sync.write(png));
          const oversizedBytes = Buffer.alloc(3 * 1024 * 1024 + 1);
          fs.writeFileSync("too-large.bin", oversizedBytes);
          console.log("Generated a valid 4097x1 PNG fixture and a file exceeding 3 MiB");
          EOF

          node --input-type=module <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import decodePng, { init as initPng } from "@jsquash/png/decode.js";

          const wasmPath = path.join(process.cwd(), "node_modules/@jsquash/png/codec/pkg/squoosh_png_bg.wasm");
          await initPng(fs.readFileSync(wasmPath));
          const bytes = fs.readFileSync("too-wide.png");
          const buffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          const decoded = await decodePng(buffer);
          assert.equal(decoded.width, 4097);
          assert.equal(decoded.height, 1);
          const MAX_BYTES = 3 * 1024 * 1024;
          const MAX_DIMENSION = 4096;
          const MAX_PIXELS = 16_000_000;
          const validateDecoded = ({ byteLength, width, height }) => {
            if (byteLength > MAX_BYTES) return "file-too-large";
            if (width > MAX_DIMENSION || height > MAX_DIMENSION || width * height > MAX_PIXELS) return "dimensions-too-large";
            return "ok";
          };
          assert.equal(validateDecoded({ byteLength: bytes.length, width: decoded.width, height: decoded.height }), "dimensions-too-large");
          assert.equal(validateDecoded({ byteLength: MAX_BYTES + 1, width: 1, height: 1 }), "file-too-large");
          console.log("Actual decoded 4097px image rejected by dimension policy");
          console.log("Actual byte count over 3 MiB rejected by file-size policy");
          EOF

      - name: Record Wrangler version
        run: /tmp/jsquash-poc/node_modules/.bin/wrangler --version
