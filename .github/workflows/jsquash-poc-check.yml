name: jSquash Cloudflare POC

on:
  push:
    branches:
      - migration/cloudflare-jSquash-poc
  pull_request:
    branches:
      - migration/cloudflare-stories
      - main

jobs:
  package-and-wasm-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated POC branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install existing locked project dependencies
        run: npm ci

      - name: Install pinned jSquash codecs and Wrangler in temporary workspace
        run: |
          mkdir -p /tmp/jsquash-poc
          cd /tmp/jsquash-poc
          npm init -y
          npm install --save-exact @jsquash/jpeg@1.6.0 @jsquash/png@3.1.1 @jsquash/webp@1.5.0 wrangler

      - name: Verify pinned package versions, decoder entry files, and actual WASM assets
        run: |
          cd /tmp/jsquash-poc
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import path from "node:path";

          const expected = {
            "@jsquash/jpeg": "1.6.0",
            "@jsquash/png": "3.1.1",
            "@jsquash/webp": "1.5.0"
          };

          for (const [name, version] of Object.entries(expected)) {
            const root = path.join(process.cwd(), "node_modules", ...name.split("/"));
            const pkg = JSON.parse(fs.readFileSync(path.join(root, "package.json"), "utf8"));
            if (pkg.version !== version) {
              throw new Error(`${name}: expected ${version}, found ${pkg.version}`);
            }

            const decoderCandidates = [
              path.join(root, "decode.js"),
              path.join(root, "dist", "decode.js")
            ];
            if (!decoderCandidates.some((candidate) => fs.existsSync(candidate))) {
              throw new Error(`${name}: no expected decoder entry file found`);
            }

            const wasmFiles = [];
            const visit = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) visit(full);
                else if (entry.name.endsWith(".wasm")) wasmFiles.push(path.relative(root, full));
              }
            };
            visit(root);
            if (wasmFiles.length === 0) {
              throw new Error(`${name}: no WASM assets found`);
            }

            console.log(`${name}@${version}: WASM assets found:`);
            for (const file of wasmFiles) console.log(`  - ${file}`);
          }
          EOF

      - name: Record Wrangler version
        run: /tmp/jsquash-poc/node_modules/.bin/wrangler --version
