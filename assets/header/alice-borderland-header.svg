<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-label="Subtle Borderland-inspired skyline, red moon, countdown clock and playing-card symbols">
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e9efff" stop-opacity="0"/><stop offset=".25" stop-color="#cbd5fa" stop-opacity=".2"/><stop offset=".62" stop-color="#27305e" stop-opacity=".94"/><stop offset="1" stop-color="#171d3a"/></linearGradient>
 <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb2ba"/><stop offset="1" stop-color="#d54b6c"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b7c8ff" stop-opacity="0"/><stop offset=".45" stop-color="#91a8ff" stop-opacity=".5"/><stop offset="1" stop-color="#ed83c7" stop-opacity=".7"/></linearGradient>
</defs>
<rect width="900" height="180" fill="url(#night)"/>
<circle cx="798" cy="31" r="45" fill="#ec5879" opacity=".12"/>
<circle cx="798" cy="31" r="32" fill="url(#moon)" opacity=".9"/>
<path d="M778 4l8 18-7 12 12 10-5 12M801 1l-5 16 8 12-4 12 9 12M818 10l-7 11 5 10-3 12" fill="none" stroke="#ffd0d8" stroke-width="1.4" opacity=".5"/>
<!-- distant skyline -->
<path d="M0 128 35 120 62 130 87 108 108 121 130 101 151 123 180 111 205 126 230 105 251 119 279 101 304 127 329 110 352 126 376 98 398 123 425 107 448 127 472 103 496 123 522 101 545 125 570 107 594 128 617 99 642 124 668 106 692 126 715 111 739 128 765 106 789 122 817 103 844 122 870 109 900 120V180H0Z" fill="#26335e" opacity=".55"/>
<!-- foreground buildings, intentionally low contrast -->
<g fill="#151d3c">
 <path d="M0 141h24v-29h15v29h17v-43h20v43h16v-22h22v22h13V91h23v50h17v-34h18v34h16v-47h25v47h15v-26h22v26h18V82h26v59h16v-36h18v36h19v-23h23v23h16V96h24v45h16v-30h18v30h15v-42h23v42h18v-26h20v26h16v-38h24v38h18v-25h21v25h19v-43h23v43h17v-30h18v30h16v-39h23v39h19v-28h20v28h18v-42h24v42h20v39H0Z"/>
</g>
<!-- scattered window lights -->
<g fill="#a6c7ff" opacity=".5">
 <path d="M78 119h3v5h-3zM84 119h3v5h-3zM157 103h3v5h-3zM164 103h3v5h-3zM236 116h3v5h-3zM243 116h3v5h-3zM315 99h3v5h-3zM323 99h3v5h-3zM403 113h3v5h-3zM411 113h3v5h-3zM489 113h3v5h-3zM497 113h3v5h-3zM585 116h3v5h-3zM593 116h3v5h-3zM678 113h3v5h-3zM686 113h3v5h-3zM742 118h3v5h-3zM750 118h3v5h-3z"/>
</g>
<!-- playing card, restrained rather than oversized -->
<g transform="translate(575 43) rotate(9)">
 <rect width="58" height="83" rx="4" fill="#edf0ff" stroke="#aebcff" stroke-width="1.5"/>
 <text x="8" y="17" font-family="Georgia,serif" font-size="13" font-weight="bold" fill="#b04467">A</text>
 <path d="M29 31c-8-12-19 0-10 9l10 10 10-10c9-9-2-21-10-9Z" fill="#202745"/>
 <path d="M9 64l12-8 8 10M39 67l10-8" fill="none" stroke="#bd6b88" stroke-width="1.2" opacity=".65"/>
</g>
<!-- thin countdown tower and clock -->
<g stroke="#0c1532" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
 <path d="M704 174 735 49 766 174M716 126h38M721 105h28M726 84h18M731 64h8M710 150l48-44M716 126l41-38M722 102l35-28M758 150l-40-36M751 125l-32-30M745 101l-24-25"/>
 <rect x="719" y="54" width="34" height="20" rx="2" fill="#1b2447" stroke="#df627f" stroke-width="1.6"/>
</g>
<text x="736" y="68" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="bold" letter-spacing=".6" fill="#ff8296">00:00</text>
<!-- understated card suits -->
<g font-family="Georgia,serif" font-size="24" text-anchor="middle">
 <text x="817" y="143" fill="#ff819c">♦</text>
 <text x="844" y="143" fill="#d9e4ff">♣</text>
 <text x="871" y="143" fill="#ff819c">♥</text>
 <text x="894" y="143" fill="#d9e4ff">♠</text>
</g>
<path d="M0 174H900" stroke="url(#edge)" stroke-width="2"/>
</svg>