<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 180" role="img" aria-label="Cinematic Borderland-inspired night skyline with a red moon, distant city, countdown tower and playing-card details">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#e9edff" stop-opacity="0"/><stop offset=".28" stop-color="#9da8d7" stop-opacity=".22"/><stop offset=".55" stop-color="#29304f"/><stop offset="1" stop-color="#11182d"/></linearGradient>
 <radialGradient id="moonGlow"><stop stop-color="#ff8a9c" stop-opacity=".48"/><stop offset="1" stop-color="#ff637e" stop-opacity="0"/></radialGradient>
 <radialGradient id="moonSurface" cx=".34" cy=".27" r=".8"><stop stop-color="#ffc2c4"/><stop offset=".5" stop-color="#e46d83"/><stop offset="1" stop-color="#a82e53"/></radialGradient>
 <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7b9ee" stop-opacity="0"/><stop offset="1" stop-color="#a9b9f1" stop-opacity=".22"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8cae"/><stop offset="1" stop-color="#a4b7ff"/></linearGradient>
 <pattern id="windows" width="13" height="12" patternUnits="userSpaceOnUse"><rect x="3" y="3" width="3" height="4" fill="#c5cfff" opacity=".48"/><rect x="9" y="8" width="2" height="2" fill="#ffb4c7" opacity=".38"/></pattern>
 <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1100" height="180" fill="url(#sky)"/>
<circle cx="962" cy="38" r="65" fill="url(#moonGlow)"/>
<circle cx="962" cy="38" r="39" fill="url(#moonSurface)" opacity=".95"/>
<g fill="#9c3f5c" opacity=".27"><circle cx="947" cy="22" r="5"/><circle cx="977" cy="48" r="8"/><circle cx="951" cy="55" r="3"/><circle cx="981" cy="19" r="4"/><circle cx="965" cy="32" r="2.5"/></g>
<path d="M927 9c13 10 19 12 31 11m-25 29c15-8 28-7 39 1m-13-44c-4 13-3 22 4 31" fill="none" stroke="#ffc6ce" stroke-width="1" opacity=".2"/>
