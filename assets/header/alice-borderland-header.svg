</g>
<g opacity=".56" fill="url(#windows)">
 <path d="M22 139h47v41H22zM93 130h69v50H93zM170 120h69v60h-69zM253 139h78v41h-78zM345 124h58v56h-58zM429 137h75v43h-75zM516 126h76v54h-76zM608 136h74v44h-74zM690 123h77v57h-77zM783 134h75v46h-75zM870 129h74v51h-74zM968 131h77v49h-77z"/>
